name: Deploy to Ionos

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install esbuild
        run: npm install --no-package-lock --no-save esbuild

      - name: Build deploy structure
        run: |
          mkdir -p dist/root dist/app

          cp landing.html  dist/root/index.html
          cp htaccess.txt  dist/root/.htaccess
          # AVV-ENTWURF.md wird bewusst NICHT deployt (ungeprüfter Vertragstext)
          cp impressum.html datenschutz.html pauschbetraege.html fuer-steuerberater.html dist/root/
          cp robots.txt sitemap.xml dist/root/
          cp favicon.png og-image.png josef.jpg splash-logo.png dist/root/
          cp app-uebersicht.png app-mahlzeiten.png app-bericht.png dist/root/

          BUILD_DATE=$(TZ=Europe/Berlin date +"%d.%m.%Y %H:%M")
          sed -e "s/__BUILD_ID__/${{ github.sha }}/g" \
              -e "s/__BUILD_DATE__/$BUILD_DATE/g" \
              app.html > dist/app/index.html

          # JSX vorkompilieren: Babel läuft nicht mehr im Browser.
          # Schlägt der Build fehl (Syntaxfehler), bricht der Deploy hier ab.
          node build.mjs dist/app/index.html

          cp manifest.json   dist/app/manifest.json
          cp splash-logo.png dist/app/splash-logo.png

          sed "s/__BUILD_ID__/${{ github.sha }}/g" sw.js > dist/app/sw.js

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy root (Landing Page)
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "set sftp:auto-confirm yes; mirror -R dist/root/ /public/; quit"

      - name: Deploy app
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "set sftp:auto-confirm yes; mirror -R dist/app/ /public/app/; quit"
