name: Deploy to Ionos

# Bei jedem Pull Request laufen die Pruefungen, bei einem Push auf main
# laufen sie und danach wird deployt. Schlaegt eine fehl, bleibt der alte
# Stand auf dem Server stehen.
#
# Bis zum 10.10.2026 gab es diesen Workflow nur zum Bauen und Deployen.
# Dreizehn Pruefungen lagen im Repository und liefen nirgends — jeder in
# diesem Jahr gefundene Fehler haette still zurueckkommen koennen.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # esbuild baut, react und react-dom werden den Browserpruefungen
      # eingespeist: im Betrieb laedt die App sie aus lib/, in der Pruefung
      # kommen sie aus node_modules.
      - name: Werkzeuge installieren
        run: |
          npm install --no-package-lock --no-save \
            esbuild react@18.2.0 react-dom@18.2.0 playwright
          npx playwright install --with-deps chromium

      - name: Rechnen, Werte, Fristen (ohne Browser)
        run: |
          node pruefung/rechnen.mjs
          node pruefung/perioden.mjs
          node pruefung/pauschbetraege.mjs
          node pruefung/freibetrag.mjs

      - name: Keine Verbindung nach draussen
        run: node pruefung-extern.mjs

      - name: Die App im echten Browser
        run: |
          node pruefung/mahlzeiten-dubletten.mjs
          node pruefung/ust-satz-exporte.mjs
          node pruefung/jahreswechsel.mjs
          node pruefung/perioden-bericht.mjs
          node pruefung/freibetrag-ausgaben.mjs
          node pruefung/sync-loeschen.mjs
          node pruefung/konto.mjs
          node pruefung/oberflaeche.mjs

      # Die Adressregeln gegen einen echten Apache mit der echten
      # .htaccess. Ohne ihn faende die Pruefung null Links und meldete
      # trotzdem Erfolg — deshalb steht der Aufbau als eigener Schritt da.
      - name: Adressregeln gegen echten Apache
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2
          bash pruefung/adressen-aufbau.sh
          bash pruefung/adressen-pruefe.sh
          node pruefung/adressen-links.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: pruefung
    # Nur vom Zweig main aus deployen. Ein Pull Request laeuft bis hierher
    # und hoert dann auf.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install esbuild
        run: npm install --no-package-lock --no-save esbuild

      - name: Build deploy structure
        run: |
          mkdir -p dist/root dist/app

          cp landing.html  dist/root/index.html
          cp htaccess.txt  dist/root/.htaccess
          # Dieser Schritt kopiert ausschliesslich die hier benannten Dateien.
          # Es gibt bewusst keine Ausschlussliste: Was nicht aufgeführt ist,
          # wird nicht deployt. config.php und config.stripe.php enthalten
          # Zugangsdaten und liegen ausschliesslich auf dem Server.
          # Nicht deployt: AVV-ENTWURF.md (ungeprüfter Vertragstext) und
          # server/ (PHP-Vorlagen, die manuell hochgeladen werden — dort
          # liegen Zugangsdaten daneben, die nichts im Deploy zu suchen haben)
          cp impressum.html datenschutz.html pauschbetraege.html fuer-steuerberater.html dist/root/
          cp eigenverbrauch-buchen.html dist/root/
          cp kuendigung.html agb.html avv.html dist/root/
          # Schriftarten liegen lokal — sie duerfen nicht wieder von Google
          # nachgeladen werden (unzulaessige Uebermittlung der IP-Adresse).
          cp schriften.css dist/root/
          cp -r fonts dist/root/fonts
          cp robots.txt sitemap.xml dist/root/
          cp favicon.png og-image.png josef.jpg splash-logo.png dist/root/
          cp app-uebersicht.png app-mahlzeiten.png app-bericht.png dist/root/

          BUILD_DATE=$(TZ=Europe/Berlin date +"%d.%m.%Y %H:%M")
          sed -e "s/__BUILD_ID__/${{ github.sha }}/g" \
              -e "s/__BUILD_DATE__/$BUILD_DATE/g" \
              app.html > dist/app/index.html

          # JSX vorkompilieren: Babel läuft nicht mehr im Browser.
          # Schlägt der Build fehl (Syntaxfehler), bricht der Deploy hier ab.
          node build.mjs dist/app/index.html

          cp manifest.json   dist/app/manifest.json
          cp splash-logo.png dist/app/splash-logo.png
          # Das Symbol der installierten App. manifest.json verwies auf
          # icon-192.png und icon-512.png — beide gab es nirgends, weder im
          # Repo noch auf dem Server. Die installierte App hatte deshalb
          # kein Symbol. favicon.png ist genau 192x192 und wird dafuer
          # unter dem im Manifest genannten Namen mitgenommen.
          cp favicon.png     dist/app/icon-192.png

          # Programmbausteine (React, xlsx, jsPDF, pdf.js) liegen lokal.
          # Vorher kamen sie von cdnjs.cloudflare.com — das uebermittelte die
          # IP-Adresse jedes Nutzers an ein US-Unternehmen, genau wie zuvor
          # die Schriftarten an Google.
          cp -r lib dist/app/lib

          sed "s/__BUILD_ID__/${{ github.sha }}/g" sw.js > dist/app/sw.js

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy root (Landing Page)
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "set sftp:auto-confirm yes; mirror -R dist/root/ /public/; quit"

      - name: Deploy app
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "set sftp:auto-confirm yes; mirror -R dist/app/ /public/app/; quit"
